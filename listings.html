<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listings — Marin &amp; West Victoria Luxury Real Estate</title>
    <meta
      name="description"
      content="Browse luxury homes for sale in Victoria, BC — oceanfront estates, heritage residences, penthouses and acreage, represented by Marin & West."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231f3a2e'/><text x='50' y='68' font-size='58' text-anchor='middle' fill='%23b8895a' font-family='Georgia'>M</text></svg>"
    />
  </head>
  <body data-page="listings">
    <div class="preloader" id="preloader">
      <span class="logo__name">Marin &amp; West</span>
    </div>
    <header class="site-header" id="header"></header>

    <section class="page-hero">
      <div class="page-hero__media">
        <img
          src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=2000&q=80"
          alt="Luxury home interior"
        />
      </div>
      <div class="page-hero__inner container">
        <p class="eyebrow" style="color: var(--brass-light)">The Portfolio</p>
        <h1 class="h1">Homes currently represented</h1>
        <p class="breadcrumb"><a href="index.html">Home</a> / Listings</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filters">
          <select id="fArea" aria-label="Filter by area">
            <option value="">All Areas</option>
          </select>
          <select id="fType" aria-label="Filter by type">
            <option value="">All Types</option>
          </select>
          <select id="fPrice" aria-label="Filter by price">
            <option value="">Any Price</option>
            <option value="u2">Under $2M</option>
            <option value="2-4">$2M – $4M</option>
            <option value="o4">Over $4M</option>
          </select>
          <select id="fStatus" aria-label="Filter by status">
            <option value="">For Sale &amp; Sold</option>
            <option value="For Sale">For Sale</option>
            <option value="Sold">Sold</option>
          </select>
          <span class="filters__count" id="fCount"></span>
        </div>
        <div class="listing-grid" id="listingsGrid" data-stagger-group></div>
      </div>
    </section>

    <section class="cta-band">
      <div class="cta-band__media">
        <img
          src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2000&q=80"
          alt="Coastal landscape"
        />
      </div>
      <div class="container">
        <h2 class="h1" style="max-width: 20ch; margin: 0 auto">
          Looking for something off-market?
        </h2>
        <p class="lead" style="color: var(--muted-light); margin: 1.2rem auto 0; max-width: 48ch">
          Many of our finest sales never reach the public market. Tell us what
          you’re searching for.
        </p>
        <div class="flex-cta" style="justify-content: center">
          <a class="btn btn--brass btn--lg" href="contact.html"
            >Start a Private Search <span class="arrow">→</span></a
          >
        </div>
      </div>
    </section>

    <footer class="site-footer" id="footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js" defer></script>
    <script src="assets/js/data.js" defer></script>
    <script src="assets/js/main.js" defer></script>
  </body>
</html>
